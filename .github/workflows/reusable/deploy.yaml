name: Shared Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

      working_directory:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "App Name: ${{ inputs.app_name }}"
          echo "Working Directory: ${{ inputs.working_directory }}"
